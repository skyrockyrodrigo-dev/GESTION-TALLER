<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de taller</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bg-white border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-4">
    <!-- Reemplace logo.png por el logo de su taller -->
    <img src="logo.png" alt="Logo del taller" class="h-14 w-auto" onerror="this.style.display='none'">
    <div>
      <h1 id="tNombre" class="text-xl font-bold text-slate-900"></h1>
      <p id="tDatos" class="text-xs text-slate-500"></p>
    </div>
    <div id="pHead" class="print-only ml-auto text-right"></div>
  </div>
  <nav class="no-print bg-slate-900">
    <div class="max-w-6xl mx-auto px-4 flex">
      <button class="tab" data-view="form">Presupuesto</button>
      <button class="tab" data-view="hist">Historial</button>
      <button class="tab" data-view="rep">Reportes</button>
    </div>
  </nav>
</header>

<main class="max-w-6xl mx-auto px-4 py-5">

<!-- PRESUPUESTO -->
<section id="v-form" class="view space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-2 no-print">
    <h2 class="text-lg font-bold">Presupuesto Nº <span id="fNum"></span></h2>
    <div class="flex gap-2">
      <button id="bNew" class="btn border bg-white">Nuevo</button>
      <button id="bSave" class="btn bg-teal-700 text-white">Guardar presupuesto</button>
      <button id="bPrint" class="btn bg-slate-900 text-white">Imprimir / Guardar PDF</button>
    </div>
  </div>
  <div class="card grid grid-cols-2 md:grid-cols-4 gap-3" id="hdr"></div>
  <div class="grid grid-cols-1 lg:grid-cols-2 print:grid-cols-1 gap-4">
    <div class="card">
      <div class="flex items-center justify-between mb-2"><h3 class="font-bold">Descripción del trabajo</h3><button class="no-print text-xs text-teal-700" id="addT">+ Agregar línea</button></div>
      <div id="trab" class="space-y-1"></div>
    </div>
    <div class="card">
      <div class="flex items-center justify-between mb-2"><h3 class="font-bold">Repuestos</h3><button class="no-print text-xs text-teal-700" id="addR">+ Agregar línea</button></div>
      <div id="rep" class="space-y-1"></div>
    </div>
  </div>
  <div class="card ml-auto max-w-md space-y-2 text-sm">
    <label class="flex items-center justify-between gap-3">Mano de obra (Gs)<input data-f="manoObra" type="number" min="0" class="inp !mt-0 w-44 text-right"></label>
    <div class="flex justify-between">Repuestos aprobados<b id="t_rep">0</b></div>
    <div class="flex justify-between text-slate-400 no-print">Repuestos no aprobados (no se suman)<span id="t_no">0</span></div>
    <div class="flex justify-between text-lg border-t pt-2">Total general<b id="t_tot">0</b></div>
  </div>
</section>

<!-- HISTORIAL -->
<section id="v-hist" class="view hidden space-y-3">
  <div id="chips" class="flex flex-wrap gap-2"></div>
  <div class="card !p-0 overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-left text-xs text-slate-500">
        <tr><th class="p-2">Nº</th><th class="p-2">Ingreso</th><th class="p-2">Cliente</th><th class="p-2">Vehículo</th><th class="p-2">Aseguradora</th><th class="p-2 text-right">Total Gs</th><th class="p-2">Aprobación</th><th class="p-2">Pago</th><th class="p-2">Liquidación</th><th class="p-2"></th></tr>
      </thead>
      <tbody id="hBody" class="divide-y divide-slate-100"></tbody>
    </table>
  </div>
</section>

<!-- REPORTES -->
<section id="v-rep" class="view hidden space-y-4">
  <div class="card flex flex-wrap items-end gap-3 no-print">
    <label class="text-xs">Período<select id="rTipo" class="inp"><option value="sem">Semanal</option><option value="mes">Mensual</option></select></label>
    <label class="text-xs">Fecha de referencia<input id="rDate" type="date" class="inp"></label>
    <button id="rPrint" class="btn bg-slate-900 text-white ml-auto">Imprimir / Guardar PDF</button>
  </div>
  <h2 class="font-bold text-lg">Informe de producción y facturación <span id="rRange" class="text-sm font-normal text-slate-500"></span></h2>
  <div id="rBody" class="space-y-4"></div>
</section>

</main>
<script src="app.js"></script>
</body>
</html>
